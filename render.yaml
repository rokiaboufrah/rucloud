services:
  - type: web
    name: rucloud-api
    runtime: python
    healthCheckPath: /api/health/
    buildCommand: bash build.sh
    preDeployCommand: cd backend && python manage.py migrate --noinput && python manage.py load_catalog
    startCommand: cd backend && gunicorn config.wsgi:application --workers=4 --max-requests=1200 --timeout=30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rucloud-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: https://rucloud.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rucloud.vercel.app
      - key: FRONTEND_URL
        value: https://rucloud.vercel.app
      - key: EXTRA_ALLOWED_ORIGINS
        value: ""
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: Ru Cloud <no-reply@rucloud.dz>
      - key: ADMIN_EMAIL
        value: ruclouddz@gmail.com
      - key: GUNICORN_CMD_ARGS
        value: "--access-logfile - --error-logfile -"

databases:
  - name: rucloud-db
    databaseName: rucloud
    plan: free
